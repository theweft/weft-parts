[package]
name = "weft-parts"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Machine-readable chip data (pinouts, address straps, device tree facts) and behavioural I2C/SPI models for board checks and driver tests."
repository = "https://github.com/theweft/weft-parts"
homepage = "https://theweft.org"
readme = "README.md"
keywords = ["i2c", "device-tree", "simulation", "embedded-hal", "pcb"]
categories = ["embedded", "simulation", "development-tools::testing"]

[features]
default = ["embedded-hal"]
# Implements embedded-hal 1.0 I2c for the simulated bus, so Rust MCU drivers run against the models.
embedded-hal = ["dep:embedded-hal"]

# Exact versions: updates are deliberate (Dependabot PR + review).
[dependencies]
embedded-hal = { version = "=1.0.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

# Independent drivers written by others: the models must satisfy them, not just weft's own reading
# of the datasheets.
[dev-dependencies]
ads1x1x = "=0.3.0"
eeprom24x = "=0.7.2"
mcp4728 = "=0.2.0"
nb = "=1.1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
